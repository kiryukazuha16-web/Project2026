
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter For You ❄️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Georgia', serif;
    overflow: hidden;
    background:
        linear-gradient(rgba(5, 18, 42, 0.35),
                        rgba(5, 18, 42, 0.55)),
        url('https://images.unsplash.com/photo-1418985991508-e47386d96a71?q=80&w=1920')
        center/cover no-repeat;
    color: white;
}

/* Overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
        180deg,
        rgba(10, 25, 55, 0.15),
        rgba(5, 15, 40, 0.55)
    );
    z-index: 0;
}

/* Main content */
.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.content {
    max-width: 650px;
    animation: appear 2s ease;
}

.subtitle {
    font-size: 13px;
    letter-spacing: 6px;
    color: #c9e9ff;
    margin-bottom: 25px;
    text-transform: uppercase;

}


/* MUSIC PLAYER */
.music-player {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 10;

    display: flex;
    align-items: center;
    gap: 13px;

    padding: 12px 18px 12px 12px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 60px;

    background: rgba(210, 235, 255, 0.16);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow: 0 5px 30px rgba(0,0,0,0.2);
    color: white;
}

/* VINYL */
.vinyl {
    width: 65px;
    height: 65px;
    flex-shrink: 0;
    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle,
            #171d29 0px,
            #252e3d 2px,
            #101722 4px,
            #252e3d 5px
        );

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow: 0 0 15px rgba(180,220,255,0.25);
}

.vinyl-center {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #d5eaff;
}

.vinyl-center img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ROTATION */
.vinyl.playing {
    animation: rotateVinyl 4s linear infinite;
}

@keyframes rotateVinyl {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* MUSIC INFORMATION */
.music-info {
    min-width: 130px;
}

.music-title {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.music-artist {
    font-size: 10px;
    color: #d0e7ff;
    margin-top: 4px;
}

.music-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
}

.music-controls button {
    padding: 0;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    color: #274663;
    font-size: 10px;
    cursor: pointer;
}

.music-controls span {
    font-size: 8px;
    letter-spacing: 2px;
    color: #e0f2ff;
}

/* MOBILE */
@media(max-width: 500px) {
    .music-player {
        bottom: 15px;
        right: 12px;
        gap: 10px;
        padding: 9px 13px 9px 9px;
    }

    .vinyl {
        width: 53px;
        height: 53px;
    }

    .music-info {
        min-width: 115px;
    }
}

h1 {
    font-size: clamp(42px, 8vw, 78px);
    font-weight: normal;
    line-height: 1.15;
    text-shadow: 0 0 25px rgba(180, 225, 255, 0.8);
}

h1 span {
    color: #d5efff;
    font-style: italic;
}

.description {
    margin: 25px auto 35px;
    max-width: 480px;
    font-size: 16px;
    line-height: 1.9;
    color: #e4f3ff;
}

button {
    padding: 15px 38px;
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 50px;
    background: rgba(220, 240, 255, 0.15);
    color: white;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.4s;
}

button:hover {
    background: white;
    color: #294968;
    box-shadow: 0 0 30px #c9e9ff;
    transform: translateY(-4px);
}

.footer {
    margin-top: 45px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #c5dff5;
}

/* Snow */
.snow {
    position: fixed;
    top: -10px;
    z-index: 3;
    color: white;
    pointer-events: none;
    user-select: none;
    animation: snowfall linear infinite;
    text-shadow: 0 0 8px white;
}

@keyframes snowfall {
    0% {
        transform: translateY(-10px) translateX(0);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) translateX(70px);
        opacity: 0.2;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile */
@media(max-width:600px) {
    .subtitle {
        letter-spacing: 4px;
        font-size: 10px;
    }

    .description {
        font-size: 14px;
    }

    button {
        padding: 14px 28px;
    }
}

</style>
</head>

<body> 
<!-- MUSIC PLAYER -->
<div class="music-player">

    <div class="vinyl" id="vinyl">
        <div class="vinyl-center">
            <img src="cover.png" alt="Album Cover">
        </div>
    </div>

    <div class="music-info">
        <div class="music-title">Beautiful In white</div>
        <div class="music-artist">West Life</div>

        <div class="music-controls">
            <button id="musicBtn" onclick="toggleMusic()">▶</button>
            <span id="musicStatus">PLAY MUSIC</span>
        </div>
    </div>
</div>

<div class="overlay"></div>

<div class="container">
    <div class="content">

        <div class="subtitle">
            ❄ A Little World For You ❄
        </div>

        <h1>
            My Winter<br>
            <span>Wonderland</span>
        </h1>

        <p class="description">
            Di antara jutaan kepingan salju yang jatuh,
            ada satu hal yang tidak pernah membeku,
            yaitu Kamu. 🤍
        </p>

        <button onclick="openHeart()">
            Untuk Kamu Tasya❄
        </button>

        <div class="footer">
            MADE WITH LOVE, JUST FOR YOU ♡
        </div>

    </div>
</div>
<audio id="backgroundMusic" loop preload="auto">
    <source src="bucin.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("backgroundMusic");
const vinyl = document.getElementById("vinyl");
const musicBtn = document.getElementById("musicBtn");
const musicStatus = document.getElementById("musicStatus");

async function toggleMusic() {
    if (music.paused) {
        try {
            await music.play();

            vinyl.classList.add("playing");
            musicBtn.innerHTML = "Ⅱ";
            musicStatus.innerHTML = "NOW PLAYING";

        } catch (error) {
            console.error("Audio error:", error);
            musicStatus.innerHTML = "AUDIO ERROR";
            alert("Musik gagal diputar. Periksa file music.mp3 kamu.");
        }

    } else {
        music.pause();

        vinyl.classList.remove("playing");
        musicBtn.innerHTML = "▶";
        musicStatus.innerHTML = "PAUSED";
    }
}

music.addEventListener("ended", () => {
    vinyl.classList.remove("playing");
});
// Membuat animasi salju
function createSnow() {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.innerHTML = Math.random() > 0.5 ? "❄" : "❅";

    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = (Math.random() * 12 + 8) + "px";
    snow.style.opacity = Math.random();
    snow.style.animationDuration = (Math.random() * 5 + 5) + "s";

    document.body.appendChild(snow);

    setTimeout(() => {
        snow.remove();
    }, 10000);
}

setInterval(createSnow, 180);

// Tombol masuk
function openHeart() {
    alert("Satu dunia kecil ini aku buat khusus untukmu. 🤍");
}
</script>

</body>
</html>
